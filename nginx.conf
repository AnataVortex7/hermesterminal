# HTTP block - फक्त /health route साठी (lightweight, no load)
http {
    server {
        listen 8080;

        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        # बाकी सगळे requests block
        location / {
            return 444;
        }
    }
}

# TCP Stream block - SSH traffic port 10000 → internal port 22
stream {
    server {
        listen 10000;
        proxy_pass 127.0.0.1:22;
        proxy_timeout 3600s;
        proxy_connect_timeout 10s;
    }
}

events {
    worker_connections 256;
}
