events { worker_connections 1024; }
http {
    server {
        listen 10000;
        location /terminal/ {
            proxy_pass http://127.0.0.1:7681/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        location /ssh {
            proxy_pass http://127.0.0.1:22;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        location / {
            return 200 "ok";
        }
    }
}